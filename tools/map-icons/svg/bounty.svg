<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="currentColor">
<!-- Crossed swords, the mark for a HUMAN COMBAT (bounty / assault) task, drawn inside
     the task reticle rather than in a badge ring. Game-icons.net "crossed-swords"
     (CC BY 3.0), the same set skull-gameicons.alt and trader-gameicons.alt came from.

     IT REPLACED A BUST (R2.57), kept at svg/bounty-bust.alt, and the reason is the one
     fact that governs any future change to either this glyph or the mutant skull:

       A SKULL AND A BUST ARE THE SAME SILHOUETTE AT 26 PX.

     Both are a round mass on top of a wider mass. The eye sockets and the shoulders
     that tell them apart are sub-pixel at the size a map spot is actually drawn, so
     the mutant mark and the human mark differed in COLOUR ALONE. Four candidates were
     built and compared at drawn size; a military helmet failed for exactly the same
     reason (round dome, same family), and paired rounds read as two bars rather than
     as ammunition.

     WHY AN X IS THE ANSWER, stated as the rule rather than the outcome: it is the only
     candidate that changes the silhouette CLASS. Every other option is a solid centred
     mass; an X is hollow in the middle with four limbs running to the corners. It is
     also nothing but long straight strokes, which is what survives the 8x downsample
     (the same property that makes the house work - see home.svg), and it is SQUARE, so
     it fills the reticle's inner box instead of taking the haircut a landscape glyph
     gets from fit(), which sizes the LONG axis. A single pistol was tried first and
     failed on precisely that: at 1.53:1 it starts at two-thirds height before the
     frame takes its cut, and collapses to a horizontal bar.

     AND IT IS NOT DECORATION. The mutant lime (176,216,72) and this mark's red
     (172,60,66) sit on the red-green axis, which is the one red-green colour
     deficiency collapses - so for those players the silhouette is not redundancy, it
     is the ONLY channel separating "a mutant hunt" from "a firefight". Two round-headed
     figures meant they could not tell them apart at all. Any replacement for either
     glyph has to clear that bar on shape alone; do not reason about the colours.

     The blade type carries nothing - knives would read identically, since at ~11 px of
     inner glyph the hilts are gone and only the X remains. Do not spend detail there.

     Filled rather than outline, per the measurement in skull.svg: at this size an
     outline glyph is mostly keyline, and a mark's apparent colour is the mean over its
     own area. -->
